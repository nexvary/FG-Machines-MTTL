name: FG Link Gateway CI

on:
  push:
    branches:
      - feature/kt708-zerotier-gateway
    paths:
      - 'gateway/**'
      - '.github/workflows/gateway-ci.yml'
  pull_request:
    paths:
      - 'gateway/**'
      - '.github/workflows/gateway-ci.yml'

jobs:
  build-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Test
        working-directory: gateway/fg-link-gateway
        run: go test ./...

      - name: Build cross-platform OpenWrt candidates
        working-directory: gateway/fg-link-gateway
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../gateway-dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../../gateway-dist/fg-link-gateway-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../../gateway-dist/fg-link-gateway-linux-arm64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags="-s -w" -o ../../gateway-dist/fg-link-gateway-linux-armv7 .
          CGO_ENABLED=0 GOOS=linux GOARCH=mips GOMIPS=softfloat go build -trimpath -ldflags="-s -w" -o ../../gateway-dist/fg-link-gateway-linux-mips .
          CGO_ENABLED=0 GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -trimpath -ldflags="-s -w" -o ../../gateway-dist/fg-link-gateway-linux-mipsle .
          sha256sum ../../gateway-dist/* > ../../gateway-dist/SHA256SUMS.txt

      - name: Upload gateway binaries
        uses: actions/upload-artifact@v4
        with:
          name: FG-Link-KT708-Gateway
          path: gateway-dist/
