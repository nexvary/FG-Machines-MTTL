name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate Home Assistant integration syntax
        run: python3 -m compileall -q home_assistant/custom_components/fg_machines_rck

      - name: Test, lint and build debug APK
        run: gradle --no-daemon clean testDebugUnitTest lintDebug assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FG-Machines-RCK-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
