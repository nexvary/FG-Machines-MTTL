name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FG_RCK_KEYSTORE_B64: ${{ secrets.FG_RCK_KEYSTORE_B64 }}
      FG_RCK_KEYSTORE_PASSWORD: ${{ secrets.FG_RCK_KEYSTORE_PASSWORD }}
      FG_RCK_KEY_ALIAS: ${{ secrets.FG_RCK_KEY_ALIAS }}
      FG_RCK_KEY_PASSWORD: ${{ secrets.FG_RCK_KEY_PASSWORD }}
      FG_RCK_CERT_SHA256: ${{ secrets.FG_RCK_CERT_SHA256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reject tracked signing secrets
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '\.(jks|keystore|p12|pfx)$'; then
            echo "Signing key material must never be committed to this public repository."
            exit 1
          fi

      - name: Validate Home Assistant integration syntax
        run: python3 -m compileall -q home_assistant/custom_components/fg_machines_rck

      - name: Test, lint and build debug + side-by-side + ARM64 fast APK
        run: gradle --no-daemon clean testDebugUnitTest lintDebug assembleDebug assembleSidecar assembleSidecarArm64

      - name: Verify side-by-side package identity
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          APK="app/build/outputs/apk/sidecar/app-sidecar.apk"
          "$AAPT" dump badging "$APK" | tee /tmp/sidecar-badging.txt
          grep -q "package: name='com.fgmachines.rck.sidecar137'" /tmp/sidecar-badging.txt
          grep -q "application-label:'FG Machines RCK 1.3.7 Test'" /tmp/sidecar-badging.txt

      - name: Verify ARM64 fast-install package
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | grep -i 'sidecarArm64' | head -n 1)"
          test -n "$AAPT"
          test -n "$APK"
          "$AAPT" dump badging "$APK" | tee /tmp/arm64-badging.txt
          grep -q "package: name='com.fgmachines.rck.sidecar137arm64'" /tmp/arm64-badging.txt
          grep -q "application-label:'FG Machines RCK 1.3.7 Fast'" /tmp/arm64-badging.txt
          if unzip -l "$APK" | grep -E 'lib/(x86|x86_64|armeabi-v7a)/'; then
            echo "Unexpected non-ARM64 native library found."
            exit 1
          fi
          ls -lh "$APK"

      - name: Prepare private release signing
        if: env.FG_RCK_KEYSTORE_B64 != ''
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FG_RCK_KEYSTORE_PASSWORD"
          test -n "$FG_RCK_KEY_ALIAS"
          test -n "$FG_RCK_KEY_PASSWORD"
          test -n "$FG_RCK_CERT_SHA256"
          KEYSTORE="$RUNNER_TEMP/fg-machines-rck-release.keystore"
          printf '%s' "$FG_RCK_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "FG_RCK_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build stable signed release APK
        if: env.FG_RCK_KEYSTORE_B64 != ''
        run: gradle --no-daemon assembleRelease

      - name: Verify stable release certificate
        if: env.FG_RCK_KEYSTORE_B64 != ''
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          APK="app/build/outputs/apk/release/app-release.apk"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/apk-certs.txt
          ACTUAL="$(grep -i 'certificate SHA-256 digest' /tmp/apk-certs.txt | head -n 1 | awk '{print $NF}' | tr 'A-F' 'a-f' | tr -d ':')"
          EXPECTED="$(printf '%s' "$FG_RCK_CERT_SHA256" | tr 'A-F' 'a-f' | tr -d ':')"
          echo "Release signing SHA-256: $ACTUAL"
          test -n "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Upload stable signed release APK
        if: env.FG_RCK_KEYSTORE_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: FG-Machines-RCK-stable-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload isolated debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FG-Machines-RCK-debug-separate-package
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload side-by-side 1.3.7 APK
        uses: actions/upload-artifact@v4
        with:
          name: FG-Machines-RCK-1.3.7-side-by-side
          path: app/build/outputs/apk/sidecar/app-sidecar.apk
          if-no-files-found: error

      - name: Upload ARM64 fast-install APK
        uses: actions/upload-artifact@v4
        with:
          name: FG-Machines-RCK-1.3.7-ARM64-Fast
          path: app/build/outputs/apk/sidecarArm64/*.apk
          if-no-files-found: error


  ui-screenshot:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download isolated debug APK
        uses: actions/download-artifact@v4
        with:
          name: FG-Machines-RCK-debug-separate-package
          path: apk-debug

      - name: Download side-by-side APK
        uses: actions/download-artifact@v4
        with:
          name: FG-Machines-RCK-1.3.7-side-by-side
          path: apk-sidecar

      - name: Capture real app dashboard screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install apk-debug/app-debug.apk
            adb install apk-sidecar/app-sidecar.apk
            adb shell pm list packages | grep -E 'com.fgmachines.rck.debug|com.fgmachines.rck.sidecar137'
            adb shell am force-stop com.fgmachines.rck.sidecar137
            adb shell am start -n com.fgmachines.rck.sidecar137/com.fgmachines.rck.MainActivity
            sleep 20
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' || true
            adb shell uiautomator dump /sdcard/fg-rck-ui.xml || true
            adb shell cat /sdcard/fg-rck-ui.xml || true
            adb exec-out screencap -p > FG-Machines-RCK-1.3.7-sidecar-dashboard.png

      - name: Upload real UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: FG-Machines-RCK-1.3.7-sidecar-screenshot
          path: FG-Machines-RCK-1.3.7-sidecar-dashboard.png
          if-no-files-found: error


  vps-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install cloud dependencies
        run: python -m pip install -r server/requirements.txt

      - name: Run cloud API tests
        env:
          PYTHONPATH: server
          FGRCK_ENV: test
          FGRCK_DATABASE_URL: sqlite+pysqlite:///./server/tests/fgrck_ci.db
          FGRCK_JWT_SECRET: ci-jwt-secret-that-is-long-enough-and-not-production
          FGRCK_TOKEN_PEPPER: ci-token-pepper-that-is-long-enough-and-not-production
        run: pytest -q server/tests

      - name: Build VPS API image
        run: docker build -t fg-machines-rck-cloud-ci server

      - name: Validate production Compose
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          FGRCK_JWT_SECRET: ci-jwt-secret-that-is-long-enough-and-not-production
          FGRCK_TOKEN_PEPPER: ci-token-pepper-that-is-long-enough-and-not-production
          FGRCK_DOMAIN: cloud.example.com
          FGRCK_ACME_EMAIL: admin@example.com
        run: docker compose -f server/docker-compose.yml config
