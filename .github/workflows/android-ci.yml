name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FG_RCK_KEYSTORE_B64: ${{ secrets.FG_RCK_KEYSTORE_B64 }}
      FG_RCK_KEYSTORE_PASSWORD: ${{ secrets.FG_RCK_KEYSTORE_PASSWORD }}
      FG_RCK_KEY_ALIAS: ${{ secrets.FG_RCK_KEY_ALIAS }}
      FG_RCK_KEY_PASSWORD: ${{ secrets.FG_RCK_KEY_PASSWORD }}
      FG_RCK_CERT_SHA256: ${{ secrets.FG_RCK_CERT_SHA256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reject tracked signing secrets
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '\.(jks|keystore|p12|pfx)$'; then
            echo "Signing key material must never be committed to this public repository."
            exit 1
          fi

      - name: Validate Home Assistant integration syntax
        run: python3 -m compileall -q home_assistant/custom_components/fg_machines_rck

      - name: Test, lint and build debug + side-by-side + ARM64 fast APK
        run: gradle --no-daemon clean testDebugUnitTest lintDebug assembleDebug assembleSidecar assembleSidecarArm64

      - name: Verify FG branding and launcher resources
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/res/drawable-nodpi/fg_machines_brand.webp
          test -s app/src/main/res/drawable/ic_fg_launcher_foreground.xml
          test -s app/src/main/res/drawable/ic_fg_logo.xml
          grep -q 'android:src="@drawable/fg_machines_brand"' app/src/main/res/layout/activity_main.xml
          grep -q 'android:icon="@mipmap/ic_launcher"' app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' app/src/main/AndroidManifest.xml
          grep -q '@drawable/ic_fg_launcher_foreground' app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -q '@drawable/ic_fg_launcher_foreground' app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          grep -q '@drawable/ic_fg_logo' app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -q '@drawable/ic_fg_logo' app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Verify side-by-side package identity
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          APK="app/build/outputs/apk/sidecar/app-sidecar.apk"
          "$AAPT" dump badging "$APK" | tee /tmp/sidecar-badging.txt
          grep -q "package: name='com.fgmachines.rck.sidecar161'" /tmp/sidecar-badging.txt
          grep -q "application-label:'FG Link 1.6.1 Test'" /tmp/sidecar-badging.txt

      - name: Verify ARM64 fast-install package
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | grep -i 'sidecarArm64' | head -n 1)"
          test -n "$AAPT"
          test -n "$APK"
          "$AAPT" dump badging "$APK" | tee /tmp/arm64-badging.txt
          grep -q "package: name='com.fgmachines.rck.sidecar161arm64'" /tmp/arm64-badging.txt
          grep -q "application-label:'FG Link 1.6.1 Fast'" /tmp/arm64-badging.txt
          if unzip -l "$APK" | grep -E 'lib/(x86|x86_64|armeabi-v7a)/'; then
            echo "Unexpected non-ARM64 native library found."
            exit 1
          fi
          ls -lh "$APK"

      - name: Prepare private release signing
        if: env.FG_RCK_KEYSTORE_B64 != ''
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FG_RCK_KEYSTORE_PASSWORD"
          test -n "$FG_RCK_KEY_ALIAS"
          test -n "$FG_RCK_KEY_PASSWORD"
          test -n "$FG_RCK_CERT_SHA256"
          KEYSTORE="$RUNNER_TEMP/fg-machines-rck-release.keystore"
          printf '%s' "$FG_RCK_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "FG_RCK_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build stable signed release APK
        if: env.FG_RCK_KEYSTORE_B64 != ''
        run: gradle --no-daemon assembleRelease

      - name: Verify stable release certificate
        if: env.FG_RCK_KEYSTORE_B64 != ''
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          APK="app/build/outputs/apk/release/app-release.apk"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/apk-certs.txt
          ACTUAL="$(grep -i 'certificate SHA-256 digest' /tmp/apk-certs.txt | head -n 1 | awk '{print $NF}' | tr 'A-F' 'a-f' | tr -d ':')"
          EXPECTED="$(printf '%s' "$FG_RCK_CERT_SHA256" | tr 'A-F' 'a-f' | tr -d ':')"
          echo "Release signing SHA-256: $ACTUAL"
          test -n "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Upload stable signed release APK
        if: env.FG_RCK_KEYSTORE_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: FG-Machines-RCK-stable-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload isolated debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FG-Link-1.6.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload side-by-side 1.5.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: FG-Link-1.6.1-side-by-side
          path: app/build/outputs/apk/sidecar/app-sidecar.apk
          if-no-files-found: error

      - name: Upload ARM64 fast-install APK
        uses: actions/upload-artifact@v4
        with:
          name: FG-Link-1.6.1-ARM64-Fast
          path: app/build/outputs/apk/sidecarArm64/*.apk
          if-no-files-found: error


  ui-screenshot:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download isolated debug APK
        uses: actions/download-artifact@v4
        with:
          name: FG-Link-1.6.1-debug
          path: apk-debug

      - name: Download side-by-side APK
        uses: actions/download-artifact@v4
        with:
          name: FG-Link-1.6.1-side-by-side
          path: apk-sidecar

      - name: Capture and verify dashboard + About branding
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -eu
            APP_PACKAGE="com.fgmachines.rck.sidecar161"
            APP_ACTIVITY="$APP_PACKAGE/com.fgmachines.rck.MainActivity"

            dump_ui() {
              name="$1"
              attempt=1
              while [ "$attempt" -le 4 ]; do
                if adb shell uiautomator dump "/sdcard/$name.xml"; then
                  adb shell cat "/sdcard/$name.xml" > "/tmp/$name.xml"
                  if grep -q '<hierarchy' "/tmp/$name.xml"; then
                    return 0
                  fi
                fi
                attempt=$((attempt + 1))
                sleep 2
              done
              echo "UI gate failed: could not obtain $name hierarchy"
              return 1
            }

            assert_main_activity() {
              adb shell dumpsys activity activities > /tmp/fg-link-activities.txt
              grep -E 'mResumedActivity|topResumedActivity' /tmp/fg-link-activities.txt | grep -q "$APP_ACTIVITY" || {
                echo "UI gate failed: FG Link MainActivity is not foreground"
                grep -E 'mResumedActivity|topResumedActivity' /tmp/fg-link-activities.txt || true
                return 1
              }
            }

            adb install apk-debug/app-debug.apk
            adb install apk-sidecar/app-sidecar.apk
            adb shell pm list packages | grep -E 'com.fgmachines.rck.debug|com.fgmachines.rck.sidecar161'
            adb shell am force-stop "$APP_PACKAGE"
            adb shell am start -n "$APP_ACTIVITY"
            sleep 20

            assert_main_activity
            dump_ui fg-link-dashboard
            grep -q "resource-id=\"$APP_PACKAGE:id/navAbout\"" /tmp/fg-link-dashboard.xml
            adb exec-out screencap -p > FG-Link-1.6.1-dashboard.png
            test -s FG-Link-1.6.1-dashboard.png

            XY="$(python3 - <<'PY'
import re
import xml.etree.ElementTree as ET

root = ET.parse("/tmp/fg-link-dashboard.xml").getroot()
for node in root.iter("node"):
    rid = node.attrib.get("resource-id", "")
    if rid.endswith(":id/navAbout"):
        m = re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", node.attrib.get("bounds", ""))
        if not m:
            raise SystemExit("navAbout has no parseable bounds")
        x1, y1, x2, y2 = map(int, m.groups())
        print((x1 + x2) // 2, (y1 + y2) // 2)
        break
else:
    raise SystemExit("navAbout was not found in the visible UI")
PY
)"
            X="${XY% *}"
            Y="${XY#* }"
            test -n "$X"
            test -n "$Y"
            adb shell input tap "$X" "$Y"
            sleep 3

            assert_main_activity
            dump_ui fg-link-about
            grep -q "resource-id=\"$APP_PACKAGE:id/fgMachinesFacebookButton\"" /tmp/fg-link-about.xml
            grep -q 'content-desc="FG MACHINES"' /tmp/fg-link-about.xml
            grep -q 'text="FG MACHINES"' /tmp/fg-link-about.xml
            adb exec-out screencap -p > FG-Link-1.6.1-about.png
            test -s FG-Link-1.6.1-about.png

      - name: Upload real UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: FG-Link-1.6.1-ui-screenshots
          path: |
            FG-Link-1.6.1-dashboard.png
            FG-Link-1.6.1-about.png
          if-no-files-found: error


  vps-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install cloud dependencies
        run: python -m pip install -r server/requirements.txt

      - name: Run cloud API tests
        env:
          PYTHONPATH: server
          FGRCK_ENV: test
          FGRCK_DATABASE_URL: sqlite+pysqlite:///./server/tests/fgrck_ci.db
          FGRCK_JWT_SECRET: ci-jwt-secret-that-is-long-enough-and-not-production
          FGRCK_TOKEN_PEPPER: ci-token-pepper-that-is-long-enough-and-not-production
        run: pytest -q server/tests

      - name: Build VPS API image
        run: docker build -t fg-machines-rck-cloud-ci server

      - name: Validate production Compose
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          FGRCK_JWT_SECRET: ci-jwt-secret-that-is-long-enough-and-not-production
          FGRCK_TOKEN_PEPPER: ci-token-pepper-that-is-long-enough-and-not-production
          FGRCK_DOMAIN: cloud.example.com
          FGRCK_ACME_EMAIL: admin@example.com
        run: docker compose -f server/docker-compose.yml config
